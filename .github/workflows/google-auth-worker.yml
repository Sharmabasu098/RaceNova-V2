name: RaceNova Google Auth Worker CI

on:
  push:
    branches:
      - main
    paths:
      - "google-auth-worker/**"
      - ".github/workflows/google-auth-worker.yml"

  pull_request:
    paths:
      - "google-auth-worker/**"
      - ".github/workflows/google-auth-worker.yml"

jobs:
  validate-google-auth-worker:
    name: Validate Google Auth Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: google-auth-worker

    steps:
      - name: Checkout RaceNova V2
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Verify Worker source files
        working-directory: .
        run: |
          test -f google-auth-worker/package.json
          test -f google-auth-worker/tsconfig.json
          test -f google-auth-worker/wrangler.jsonc
          test -f google-auth-worker/src/index.ts
          test -f google-auth-worker/src/http.ts
          test -f google-auth-worker/src/types.ts
          test -f google-auth-worker/src/googleVerification.ts

          echo "Google Auth Worker structure: PASS"

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run
